<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت فاکتور</title>
<meta name="description" content="مدیریت فاکتور، دریافتی و هزینه‌ها، چک‌ها و کارمندان — کاملاً داخل مرورگر شما">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#69718a;
  --border:#e4e8f2; --accent:#3b6ef5; --accent-soft:#eaf0ff;
  --green:#189a68; --green-soft:#e4f6ee; --red:#d64545; --red-soft:#fdeaea;
  --amber:#b97d10; --amber-soft:#fcf2df; --shadow:0 6px 20px rgba(28,35,51,.07);
}
html[data-theme="dark"]{
  --bg:#0e1220; --card:#161b2c; --text:#e8ecf8; --muted:#939cbb;
  --border:#262d44; --accent:#6d95ff; --accent-soft:#1d2745;
  --green:#3fce97; --green-soft:#12301f; --red:#ff7a7a; --red-soft:#3a1a1a;
  --amber:#eab24a; --amber-soft:#372a10; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.7 Vazirmatn,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--card);color:var(--text);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
a{color:var(--accent);text-decoration:none}

/* header */
header{background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20}
.hbar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo .ic{width:34px;height:34px;border-radius:10px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:16px}
.hbar .spacer{margin-inline-start:auto}
.searchbox{order:2;width:100%;flex-basis:100%}
@media(min-width:760px){.searchbox{width:auto;flex-basis:220px}}
#searchbox input{padding:7px 12px;font-size:13.5px;border-radius:9px;background:var(--bg)}
#theme-btn{border:1px solid var(--border);background:transparent;border-radius:9px;
  padding:6px 10px;color:var(--muted);font-size:15px}
#theme-btn:hover{color:var(--accent);border-color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap;order:3;width:100%;overflow-x:auto}
@media(min-width:760px){nav{width:auto;order:0;margin-inline-start:auto;overflow:visible}}
nav button{border:none;background:transparent;color:var(--muted);
  padding:7px 13px;border-radius:9px;font-weight:500;font-size:14px;white-space:nowrap}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff}

/* cards + layout */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:130px}
.row>.fit{flex:0 0 auto;min-width:0}

.stat{border-radius:16px;padding:16px;border:1px solid var(--border)}
.stat .t{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat.income{background:var(--green-soft);border-color:transparent}
.stat.income .v{color:var(--green)}
.stat.expense{background:var(--red-soft);border-color:transparent}
.stat.expense .v{color:var(--red)}
.stat.balance{background:var(--accent-soft);border-color:transparent}
.stat.balance .v{color:var(--accent)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;
  padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}
.num{font-weight:700;white-space:nowrap}
td.num,th.num{text-align:left;direction:ltr}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--bg);color:var(--muted)}
.mono{font-family:monospace;direction:ltr;display:inline-block}

/* buttons */
.btn{border:none;border-radius:10px;padding:9px 18px;font-weight:600;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn.icon{background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 10px}
.btn.icon:hover{color:var(--red);border-color:var(--red)}
.btn.icon.blue:hover{color:var(--accent);border-color:var(--accent)}

/* misc */
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);
  background:var(--text);color:var(--bg);padding:10px 22px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
.hint{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backlink{display:inline-block;margin-bottom:10px;font-size:13.5px}
.month-tbl td,.month-tbl th{text-align:center}
.month-tbl td:first-child,.month-tbl th:first-child{text-align:right}

/* Jalali date picker popup */
.jpicker{position:fixed;z-index:60;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);padding:12px;width:266px;display:none;user-select:none}
.jpicker .jp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.jpicker .jp-head b{font-size:14px}
.jpicker .jp-nav{border:none;background:transparent;color:var(--muted);font-size:16px;padding:2px 10px;border-radius:8px}
.jpicker .jp-nav:hover{background:var(--accent-soft);color:var(--accent)}
.jpicker .jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.jpicker .jp-wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.jpicker .jp-day{text-align:center;padding:6px 0;border-radius:8px;font-size:13px;cursor:pointer}
.jpicker .jp-day:hover{background:var(--accent-soft)}
.jpicker .jp-day.sel{background:var(--accent);color:#fff;font-weight:700}
.jpicker .jp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.jpicker .jp-foot{display:flex;justify-content:space-between;margin-top:8px}
.jpicker .jp-foot button{border:none;background:transparent;color:var(--accent);font-size:13px;padding:4px 8px;border-radius:8px}
.jpicker .jp-foot button:hover{background:var(--accent-soft)}

/* invoice share page */
.inv{max-width:720px;margin:0 auto;padding:0!important;border:none!important;box-shadow:none!important;background:transparent!important}
.inv-inner{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.inv-top{background:linear-gradient(135deg,var(--accent),#8a5cf6);color:#fff;padding:20px 22px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.inv-top .t1{font-size:18px;font-weight:800}
.inv-top .t2{font-size:13px;opacity:.85}
.paid-banner{background:var(--green-soft);color:var(--green);border-radius:12px;
  padding:12px 16px;font-weight:700;margin:14px 0}
.pay-line .fld{flex:1;min-width:0}
.inv-body{padding:20px 22px}
.soc-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.soc{border:1px solid var(--border);border-radius:999px;padding:6px 16px;font-size:13.5px;color:var(--text)}
.soc:hover{border-color:var(--accent);color:var(--accent)}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px dashed var(--border);padding-bottom:14px;margin-bottom:14px;gap:10px;flex-wrap:wrap}
@media print{
  header,.noprint,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:none;padding:0}
  .inv-top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tblwrap{overflow:visible!important;max-height:none!important}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo"><span class="ic">🧾</span><span id="app-title">مدیریت فاکتور</span></div>
    <div class="searchbox">
      <form id="gform" role="search"><input id="gsearch" placeholder="جستجو (شخص، آیتم، فاکتور، چک…)" autocomplete="off"></form>
    </div>
    <button id="theme-btn" title="تغییر تم" aria-label="تغییر تم">🌙</button>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   مدیریت فاکتور — a fully client-side invoice & finance manager.
   Persian / RTL. All data lives in localStorage; nothing leaves
   the browser. Shared invoices are encoded into the URL itself.
   ============================================================ */

var STORE_KEY = "invoice_manager_v1";
var $ = function (s) { return document.querySelector(s); };

/* ---------- storage ---------- */
/* standard معین chart (seeded into every fresh doc); load() seeds legacy dbs too */
function seedCats() {
  var seeds = [
    { name: "بدهکاران (مطالبات از مشتریان)", type: "income" },
    { name: "درآمدها", type: "income" },
    { name: "بانک", type: "income" },
    { name: "صندوق", type: "income" },
    { name: "بستانکاران (بدهی به تامین‌کنندگان)", type: "expense" },
    { name: "هزینه‌ها", type: "expense" },
    { name: "متریال و مصالح", type: "expense" },
    { name: "دستمزد و حقوق", type: "expense" },
    { name: "کرایه و حمل", type: "expense" },
    { name: "پیش‌پرداخت‌ها", type: "expense" }
  ];
  return seeds.map(function (s, i) { return { id: "seed_m_" + (i + 1), code: i + 1, name: s.name, type: s.type }; });
}
function defaultData() {
  return {
    profile: {
      name: "", bank: "", sheba: "", card: "", phone: "",
      payNote: "لطفاً پس از واریز، رسید پرداختی را به شماره {phone} ارسال نمایید.",
      socials: { instagram: "", telegram: "", whatsapp: "", site: "" }
    },
    people: [],   // {id, name, role, phone, nationalId, address, notes}
    entries: [],  // {id, type:"income"|"expense", title, amount, date, personId, tracking}
    accounts: [], // {id, alias, bank, sheba, accNumber, card}
    invoices: [], // {id, number, tracking, personId, date, items:[{title, amount}], paid}
    transactions: [], // {id, type:"cheque"|"cash"|"transfer"|"card", direction:"incoming"|"outgoing",
                      //  amount, date, personId, accountId, notes,
                      //  cheque fields: number, bank, sayad, dueDate, status, history}
    cats: seedCats(), // معین accounts: {id, code, name, type:"income"|"expense"}
    tafsils: [],  // تفصیلی accounts (standalone; people are تفصیلی too): {id, code, name, catId}
    seededLedger: true, // standard معین chart seeded once
    supervisionPercent: 12, // default مبلغ نظارت percent for new invoices (per-invoice override allowed)
    autoBackup: true, // daily local snapshot in localStorage (inv_ab_snapshot)
    seq: 1000     // sequential invoice numbers
  };
}
function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultData();
    var d = JSON.parse(raw);
    var base = defaultData();
    for (var k in base) if (d[k] === undefined) d[k] = base[k];
    if (!d.accounts) d.accounts = [];
    if (d.profile && !d.profile.socials) d.profile.socials = { instagram: "", telegram: "", whatsapp: "", site: "" };

    /* one-time migration: old db.cheques + db.payments -> db.transactions */
    if (!d.transactions) {
      d.transactions = [];
      (d.cheques || []).forEach(function (c) {
        d.transactions.push({
          id: c.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
          type: "cheque",
          direction: c.direction || "incoming",
          amount: c.amount, date: c.dueDate || "",
          personId: c.personId || null, accountId: null, notes: c.notes || "",
          number: c.number, bank: c.bank || "", sayad: c.sayad || "",
          dueDate: c.dueDate, status: c.status || "open", history: c.history || []
        });
      });
      (d.payments || []).forEach(function (p) {
        d.transactions.push({
          id: p.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
          type: p.kind || "cash",
          direction: "incoming",
          amount: p.amount, date: p.date,
          personId: p.personId || null, accountId: p.accountId || null, notes: p.notes || "",
          status: null, history: []
        });
      });
      delete d.cheques;
      delete d.payments;
    }
    d.transactions.forEach(function (t) {
      if (t.type === "cheque" && !t.status) t.status = "open";
      if (!t.history) t.history = [];
    });
    assignTafsilCodes(d.people);
    /* legacy dbs: seed the standard معین chart once (بدهکاران، بستانکاران، هزینه‌ها، …) */
    if (!d.seededLedger && (!d.cats || !d.cats.length)) {
      d.cats = seedCats();
      d.seededLedger = true;
    }
    return d;
  } catch (e) { return defaultData(); }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
var db = load();

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("#theme-btn").textContent = t === "dark" ? "☀️" : "🌙";
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.remove();
  meta = document.createElement("meta");
  meta.name = "theme-color";
  meta.content = t === "dark" ? "#0e1220" : "#f4f6fb";
  document.head.appendChild(meta);
}
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem("invoice_theme"); } catch (e) {}
  var t = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var m = document.createElement("meta"); m.name = "theme-color"; m.content = "#f4f6fb"; document.head.appendChild(m);
  applyTheme(t);
})();

/* ---------- helpers ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function tracking() {
  var s = "";
  for (var i = 0; i < 8; i++) s += Math.floor(Math.random() * 10);
  return s;
}
function money(n) { return Number(n || 0).toLocaleString("fa-IR"); }
/* live thousand-separator formatting for amount inputs */
function digitsOnly(s) { return String(s || "").replace(/[^\d]/g, ""); }
function bindAmountInput(el) {
  el.addEventListener("input", function () {
    var d = digitsOnly(el.value).slice(0, 15);
    el.value = d ? Number(d).toLocaleString("en-US").replace(/,/g, "٬") : "";
  });
}
function readAmount(el) { return Number(digitsOnly(el.value)) || 0; }
function today() { return new Date().toISOString().slice(0, 10); }
function faDate(iso) {
  if (!iso) return "—";
  return isoToJalaliStr(iso) || iso;
}
function faMonthKey(iso) {
  try { return new Date(iso).toLocaleDateString("fa-IR", { year: "numeric", month: "long" }); }
  catch (e) { return iso; }
}
function daysTo(iso) {
  var d = Math.ceil((new Date(iso) - new Date(today())) / 86400000);
  return isNaN(d) ? null : d;
}
function personName(id) {
  for (var i = 0; i < db.people.length; i++) if (db.people[i].id === id) return db.people[i].name;
  return "—";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
/* ---------- accounting accounts (معین / تفصیلی) ---------- */
function faPad(n) {
  var v = Number(n) || 0;
  var s = (v < 100 ? "0" : "") + (v < 10 ? "0" : "") + v;
  return s.replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; });
}
function catName(id) {
  if (!id) return "";
  for (var i = 0; i < db.cats.length; i++) if (db.cats[i].id === id) return db.cats[i].name;
  return "";
}
function tafsilName(id) {
  if (!id) return "";
  for (var i = 0; i < db.tafsils.length; i++) if (db.tafsils[i].id === id) return db.tafsils[i].name;
  return "";
}
/* تفصیلی of an entry: a person IS a تفصیلی; a free-standing tafsils record is the fallback */
function tafsilLabel(id) { return personName(id) !== "—" ? personName(id) : tafsilName(id); }
function nextCode(list) {
  var max = 0;
  (list || []).forEach(function (x) { if (Number(x.code) > max) max = Number(x.code); });
  return max + 1;
}
function assignTafsilCodes(people) {
  var max = 0;
  (people || []).forEach(function (p) { if (Number(p.tCode) > max) max = Number(p.tCode); });
  (people || []).forEach(function (p) {
    if (!(Number(p.tCode) > 0)) { max += 1; p.tCode = max; }
  });
}
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function personOptions(sel) {
  return db.people.map(function (p) {
    return '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + ">" +
      esc(p.name) + " (" + (p.role === "employer" ? "کارفرما" : "کارمند") + ")</option>";
  }).join("");
}
/* Enter key submits the form whose button is given */
function bindEnter(rootSel, btnSel) {
  $(rootSel).querySelectorAll("input,select").forEach(function (el) {
    el.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); $(btnSel).click(); }
    });
  });
}
function typeBadge(t) {
  return t === "income" ? '<span class="badge b-green">دریافتی</span>'
    : '<span class="badge b-red">هزینه</span>';
}

/* ---------- Jalali (Persian, Solar Hijri) calendar ----------
   Internal dates stay Gregorian ISO (YYYY-MM-DD); only the input UI
   and the popup calendar speak Jalali. */
function g2j(gy, gm, gd) {
  var g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + (~~((gy2 + 3) / 4)) - (~~((gy2 + 99) / 100)) +
    (~~((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * ~~(days / 12053); days %= 12053;
  jy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  var gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  var days = (365 * jy) + (~~(jy / 33) * 8) + (~~(((jy % 33) + 3) / 4)) + 78 + jd +
    ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * ~~(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * ~~(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var leap = ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0));
  var sal = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var gm;

/* ---------- backup safety net ---------- */
/* daily local snapshot: at most once per Jalali day, written in the
   inv_ab_snapshot localStorage key (kept separate from the live data) */
function backupFileDateISO() { return String(localStorage.getItem("inv_lastfile_bk") || ""); }
function autoBackupTick() {
  try {
    if (db.autoBackup === false) return;
    var key = "inv_ab_snapshot";
    var prev = null;
    try { prev = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) {}
    if (prev && prev.d === today()) return; // snapshot from today already exists
    try {
      localStorage.setItem(key, JSON.stringify({ d: today(), t: new Date().toISOString(), data: db }));
    } catch (e2) {
      /* most likely quota exceeded — stay quiet, just stop trying today */
      try { localStorage.setItem("inv_ab_quota", "1"); } catch (e3) {}
    }
  } catch (e) {}
}

  try { return JSON.parse(localStorage.getItem("inv_ab_snapshot") || "null"); } catch (e) { return null; }
}
/* sanity-check a backup file/local snapshot before replacing the live db */
function validateBackup(d) {
  var counts = {}, errs = [];
  if (typeof d !== "object" || d === null || Array.isArray(d)) {
    return { ok: false, errs: ["ساختار فایل نامعتبر است — انتظار یک object JSON می‌رفت."], counts: counts };
  }
  /* legacy factor-manager backups (converted on import, like before) */
  if (Array.isArray(d.employers) && Array.isArray(d.employees)) {
    var ppl = d.employers.length + d.employees.length, items = 0;
    d.employers.concat(d.employees).forEach(function (e) { (e.items || []).forEach(function () { items++; }); });
    return { ok: true, legacy: true, errs: [], counts: { "شخص": ppl, "آیتم": items } };
  }
  var known = 0;
  ["people", "entries", "invoices", "transactions", "accounts", "cats", "tafsils"].forEach(function (k) {
    if (Array.isArray(d[k])) { known++; counts[k === "cats" ? "معین" : k === "tafsils" ? "تفصیلی" : k === "people" ? "شخص" : k === "entries" ? "آیتم" : k === "invoices" ? "فاکتور" : k === "transactions" ? "تراکنش" : "حساب بانکی"] = d[k].length; }
  });
  if (!known) return { ok: false, errs: ["هیچ دادهٔ شناخته‌شده‌ای (people/entries/invoices/…) در فایل نیست."], counts: counts };
  (d.entries || []).forEach(function (e, i) {
    if (!e || typeof e !== "object" || !(Number(e.amount) > 0)) errs.push("آیتم شماره " + (i + 1) + " فاقد مبلغ معتبر است.");
  });
  (d.invoices || []).forEach(function (v, i) {
    if (!v || !Array.isArray(v.items)) errs.push("فاکتور شماره " + (i + 1) + " فاقد لیست آیتم است.");
  });
  (d.people || []).forEach(function (p, i) {
    if (!p || typeof p !== "object" || !p.name) errs.push("شخص شماره " + (i + 1) + " نام ندارد.");
  });
  if (d.seq != null && !(Number(d.seq) >= 0)) errs.push("شماره‌گذاری فاکتور (seq) نامعتبر است.");
  return { ok: errs.length === 0, legacy: false, errs: errs, counts: counts };
}

function compactMoney(n) {

  if (n >= 1e6) return Number((n / 1e6).toFixed(1)).toLocaleString("fa-IR") + " م";

  return money(n);
}
function monthlySeries(n) {

  var out = [];
  for (var i = n - 1; i >= 0; i--) {
    var m = j[1] - i, y = j[0];
    while (m < 1) { m += 12; y--; }
    var a = j2g(y, m, 1), b = j2g(y, m, jMonthLen(y, m));
    var from = isoOf(new Date(a[0], a[1] - 1, a[2]));
    var to = isoOf(new Date(b[0], b[1] - 1, b[2]));
    var inc = 0, exp = 0;
    db.entries.forEach(function (e) {
      if (e.date >= from && e.date <= to) {
        if (e.type === "income") inc += Number(e.amount || 0);
        else exp += Number(e.amount || 0);

    out.push({ label: JP_MONTHS[m - 1], income: inc, expense: exp });
  }
  return out;
}

    bars.forEach(function (bar) {

  var C = 2 * Math.PI * 52, off = 0;

function catOptionsGrouped(selId) {
  var inc = "", exp = "";
  db.cats.slice().sort(function (a, b) { return Number(a.code) - Number(b.code); })
    .forEach(function (c) {
      var o = '<option value="' + esc(c.id) + '">معین-' + faPad(c.code) + " — " + esc(c.name) + "</option>";
      if (c.type === "income") inc += o; else exp += o;
    });
  var out = '<option value="">—</option>' +
    (inc ? '<optgroup label="سمت دریافتی">' + inc + "</optgroup>" : "") +
    (exp ? '<optgroup label="سمت هزینه">' + exp + "</optgroup>" : "");
  if (selId) out = out.replace('<option value="' + esc(selId) + '"', '<option value="' + esc(selId) + '" selected');
  return out;
}

  } catch (e) {}

  function jStartISO() {
    var t = new Date();
    var j = g2j(t.getFullYear(), t.getMonth() + 1, t.getDate());
    var g = j2g(j[0], j[1], 1);
    return isoOf(new Date(g[0], g[1] - 1, g[2]));
  }
  function daysAgoISO(n) { return isoOf(new Date(Date.now() - n * 86400000)); }

  function filtered() {
    var q = $("#f-q").value.trim().toLowerCase();
    var type = $("#f-type").value;
    var person = $("#f-person").value;
    var from = readIso("#f-from") || "";
    var to = readIso("#f-to") || "";
    var sort = $("#f-sort").value;
    var rows = db.entries.filter(function (e) {
      if (type && e.type !== type) return false;
      if (person && e.personId !== person) return false;
      if (from && (e.date || "") < from) return false;
      if (to && (e.date || "") > to) return false;
      if (q) {
        var hay = (e.title + " " + (e.tracking || "") + " " + (e.note || "") + " " + personName(e.personId)).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    rows.sort(function (a, b) {
      if (sort === "old") return (a.date || "") < (b.date || "") ? -1 : 1;
      if (sort === "high") return b.amount - a.amount;
      if (sort === "low") return a.amount - b.amount;
      return (b.date || "") < (a.date || "") ? -1 : 1;
    });
    return rows;
  }
  function summary(list) {
    var t = totals(list);
    $("#f-summary").textContent = list.length
      ? "نمایش " + money(list.length) + " مورد — دریافتی: " + money(t.income) + " | هزینه: " + money(t.expense) + " ریال"
      : "";

  function bulkBar() {
    var checked = $("#entries-list").querySelectorAll(".ck-row:checked");

    bar.innerHTML = '<div class="row" style="align-items:center">' +
      '<span class="hint"><b>' + money(checked.length) + "</b> مورد انتخاب شده</span>" +
      '<button class="btn sm danger" id="bulk-del">حذف انتخاب‌شده‌ها</button></div>';
    $("#bulk-del").onclick = function () {
      if (!confirm("حذف " + checked.length + " آیتم انتخاب‌شده؟ این عمل بازگشت‌پذیر نیست.")) return;
      var ids = {};
      checked.forEach(function (ck) { ids[ck.dataset.ck] = true; });
      db.entries = db.entries.filter(function (x) { return !ids[x.id]; });
      save(); toast("آیتم‌های انتخاب‌شده حذف شدند."); list();
    };

    $("#entries-list").innerHTML = rows.length ? '<div class="tblwrap"><table><thead><tr>' +
      '<th style="width:30px"><input type="checkbox" id="ck-all"></th>' +
      "<th>نوع</th><th>نام آیتم</th><th>شخص</th><th>توضیحات</th><th>مبلغ (ریال)</th><th>تاریخ</th><th>کد پیگیری</th><th></th>" +
      "</tr></thead><tbody>" + rows.map(function (e) {
        return "<tr><td><input type='checkbox' class='ck-row' data-ck='" + e.id + "'></td><td>" + typeBadge(e.type) +

          "<td class='num'>" + money(e.amount) +

          "<td><div style='display:flex;gap:6px'>" +
          "<button class='btn icon sm blue' data-edit='" + e.id + "'>ویرایش</button>" +
          "<button class='btn icon sm' data-del='" + e.id + "'>حذف</button></div></td></tr>";
      }).join("") + "</tbody></table></div>"
      : '<div class="empty">موردی مطابق فیلترها پیدا نشد.</div>';

    $("#entries-list").querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        var e = db.entries.find(function (x) { return x.id === b.dataset.del; });
        if (!confirm("آیا از حذف آیتم «" + (e ? e.title : "") + "» مطمئن هستید؟")) return;
        db.entries = db.entries.filter(function (x) { return x.id !== b.dataset.del; });
        if (editingEntry && editingEntry.id === b.dataset.del) resetForm();
        save(); toast("آیتم حذف شد."); list();

      b.onclick = function () {

        editingEntry = e;
        $("#e-type").value = e.type;
        $("#e-title").value = e.title;
        $("#e-amount").value = e.amount.toLocaleString("en-US").replace(/,/g, "٬");

        $("#e-add").textContent = "بروزرسانی";

        $("#entry-form-title").textContent = "ویرایش آیتم";

    $("#entries-list").querySelectorAll(".ck-row").forEach(function (ck) {
      ck.onchange = bulkBar;
    });

  function resetForm() {
    editingEntry = null;
    $("#e-type").value = "income";
    $("#e-title").value = ""; $("#e-amount").value = ""; $("#e-note").value = "";
    $("#e-person").value = "";
    setJalali("#e-date", today());
    $("#e-add").textContent = "افزودن";
    $("#e-cancel-wrap").style.display = "none";
    $("#entry-form-title").textContent = "آیتم جدید";
  }
  $("#e-cancel").onclick = resetForm;
  $("#e-add").onclick = function () {

      editingEntry.title = title;

      editingEntry.date = readIso("#e-date") || editingEntry.date || today();

      delete editingEntry.tafsilId;
      delete editingEntry.catId;
      save(); toast("آیتم بروزرسانی شد."); resetForm(); list();
    } else {
      db.entries.push({
        id: uid(), type: $("#e-type").value, title: title, amount: amount,
        date: readIso("#e-date") || today(), personId: $("#e-person").value || null,
        note: $("#e-note").value.trim(), tracking: tracking()
      });
      save(); toast("آیتم ثبت شد."); viewEntries();

/* convert a factor-manager (org website) backup into the invoice-manager shape */
function normIso(d, createdAt) {
  var s = String(d || "").trim();
  var m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) {
    var y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
    if (y < 1700) { var g = j2g(y, mo, da); y = g[0]; mo = g[1]; da = g[2]; }
    return y + "-" + (mo < 10 ? "0" : "") + mo + "-" + (da < 10 ? "0" : "") + da;
  }
  var c = String(createdAt || "").slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(c) ? c : "";
}
function convertFactorManagerBackup(old) {
  var d = defaultData();
  var st = old.settings || {};
  /* profile + bank account from the old payment profile */
  var profiles = st.paymentProfiles || [];
  var prof = profiles.find(function (x) { return x.id === st.selectedPaymentProfileId; }) || profiles[0];
  if (prof) {
    d.profile = {
      name: prof.name || "", bank: prof.profileBank || "",
      sheba: String(prof.iban || "").replace(/^IR/, ""),
      card: prof.card || "", phone: prof.phone || "",
      payNote: db.profile.payNote || defaultData().profile.payNote,
      socials: (db.profile && db.profile.socials) || { instagram: "", telegram: "", whatsapp: "", site: "" }
    };
    if (d.profile.sheba || d.profile.card) {
      d.accounts.push({ id: uid(), alias: prof.profileName || "حساب اصلی", bank: prof.profileBank || "",
        sheba: d.profile.sheba, accNumber: "", card: d.profile.card });
    }
  }
  if (st.supervisionPercent != null) d.supervisionPercent = Math.round(Number(st.supervisionPercent) * 100) || 0;
  var count = 0;
  function addItems(items, personId) {
    (items || []).forEach(function (it) {
      var noteParts = [];
      (it.attachments || []).forEach(function (a) { if (a && a.filename) noteParts.push("📎 " + a.filename); });
      d.entries.push({
        id: it.id || uid(),
        type: it.type === "received" ? "income" : "expense",
        title: it.name || "", amount: Math.round(Number(it.amount) || 0),
        date: normIso(it.date, it.createdAt),
        personId: personId, tracking: it.trackingCode || "",
        notes: noteParts.join("، ")
      });
      count++;
    });
  }
  (old.employers || []).forEach(function (e) {
    var notes = [];
    if (e.supervisionPercent != null && e.supervisionPercent !== "")
      notes.push("درصد نظارت: " + faPercent(Math.round(e.supervisionPercent * 100)) + "٪ (پایه: " +
        (e.supervisionBase === "received" ? "دریافتی" : "خرج کرد") + ")");
    d.people.push({ id: e.id || uid(), name: e.name || "", role: "employer", notes: notes.join("، ") });
    addItems(e.items, e.id);
  });
  (old.employees || []).forEach(function (e) {
    d.people.push({ id: e.id || uid(), name: e.name || "", role: "employee",
      notes: e.position ? "شغل: " + e.position : "" });
    addItems(e.items, e.id);
  });
  return { data: d, itemCount: count };
}

/* find a good db-restore path: merge stored defaults into a validated backup,
   ask for confirmation with real counts, then swap + save */
function restoreBackup(d, sourceLabel, done) {
  var v = validateBackup(d);
  if (!v.ok) {
    toast("بازنشانی ناموفق: " + (v.errs[0] || "فایل معتبر نیست."));
    return false;
  }
  var cnt = Object.keys(v.counts).map(function (k) { return k + ": " + money(v.counts[k]); }).join(" — ") || "خالی";
  if (!confirm("بازیابی " + sourceLabel + "\n\n" + cnt + "\n\nداده‌های فعلی با این نسخه جایگزین می‌شوند. ادامه می‌دهید؟")) return false;
  var base = defaultData();
  var extra = {};
  if (v.legacy) { /* factor-manager: convert first */
    var conv = convertFactorManagerBackup(d);
    d = conv.data;
  }
  for (var k in base) if (d[k] === undefined) d[k] = base[k];
  if (d.profile && !d.profile.socials) d.profile.socials = base.profile.socials;
  db = d; save();
  toast("بازیابی انجام شد (" + sourceLabel + ").");
  if (done) done();
  go("dashboard");
  return true;
}
function exportCsv(rows, suffix) {
  var rows2 = [["نوع", "نام آیتم", "شخص", "توضیحات", "مبلغ (ریال)", "تاریخ", "کد پیگیری"]];
  rows.forEach(function (e) {
    rows2.push([e.type === "income" ? "دریافتی" : "هزینه", e.title,
      personName(e.personId), e.note || "",
      e.amount, e.date, e.tracking]);
  });
  var csv = "\uFEFF" + rows2.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "items" + (suffix ? "-" + suffix : "") + ".csv";
  a.click();
  toast("فایل CSV دانلود شد.");
}

/* ================= person statement (صورتحساب فرد) ================= */
function invoiceTotals(v) {
  var sum = v.items.reduce(function (s, i) {
    return s + Number(i.amount || 0) * Math.max(1, Number(i.qty || 1) || 1);
  }, 0);
  var sp = v.supervisionPercent != null ? Math.max(0, Math.min(100, Number(v.supervisionPercent) || 0)) : 0;
  var sup = Math.round(sum * sp / 100);
  return { sum: sum, sup: sup, total: sum + sup };
}
function viewPerson(id) {
  var p = db.people.find(function (x) { return x.id === id; });
  if (!p) { $("#view").innerHTML = '<div class="card"><div class="empty">شخص پیدا نشد.</div></div>'; return; }

  var p2 = today().split("-");
  var j = g2j(+p2[0], +p2[1], +p2[2]);
  var ys = j2g(j[0], 1, 1);
  $("#view").innerHTML =
    '<div class="noprint-back"><a class="backlink noprint" href="#/people">→ بازگشت به کارکنان و کارفرما</a></div>' +
    '<div class="card"><h2>صورتحساب: ' + esc(p.name) + " " + personRoleBadge(p) + '</h2>' +
      '<p class="hint">📒 تفصیلی-' + faPad(p.tCode) + " — 📗 معین: " + esc((p.catId && catName(p.catId)) || "بدون معین") +
      (p.phone ? " — 📞 " + esc(p.phone) : "") + '</p>' +
      '<div class="row noprint">' +
        '<div><label>از تاریخ (خالی = همه زمان‌ها)</label><input id="a-from" class="jdate" inputmode="numeric" placeholder="۱۴۰۵/۰۱/۰۱"></div>' +
        '<div><label>تا تاریخ</label><input id="a-to" class="jdate" inputmode="numeric" placeholder="۱۴۰۵/۱۲/۲۹"></div>' +
        '<div class="fit"><button class="btn ghost sm" id="a-year">امسال</button></div>' +
        '<div class="fit"><button class="btn ghost sm" id="a-all">همه زمان‌ها</button></div>' +
        '<div class="fit"><button class="btn ghost sm" id="a-csv">دانلود اکسل (CSV)</button></div>' +
        '<div class="fit"><button class="btn ghost sm" id="a-print">🖨 چاپ صورتحساب</button></div>' +
      "</div>" +
    "</div>" +
    '<div id="st-body"></div>';

  function compute() {
    var from = readIso("#a-from") || "", to = readIso("#a-to") || "";
    function inR(d) { return (!from || d >= from) && (!to || d <= to); } // خالی = بدون حد
    var entries = db.entries.filter(function (e) { return e.personId === p.id && inR(e.date || ""); });
    var invoices = db.invoices.filter(function (v) { return v.personId === p.id && inR(v.date || ""); });
    var txs = db.transactions.filter(function (t) { return t.personId === p.id && inR(t.date || ""); });
    return { entries: entries, invoices: invoices, txs: txs };
  }
  function renderBody() {
    var d = compute();
    var entryIncome = 0, entryExpense = 0;
    d.entries.forEach(function (e) {
      if (e.type === "income") entryIncome += Number(e.amount || 0); else entryExpense += Number(e.amount || 0);
    });
    var invSum = 0, invPaid = 0, invUnpaid = 0;
    d.invoices.forEach(function (v) {
      var tt = invoiceTotals(v);
      invSum += tt.total;
      if (v.paid) invPaid += tt.total; else invUnpaid += tt.total;
    });
    var cashIn = 0, cashOut = 0, chequeInOpen = 0, chequeOutOpen = 0;
    d.txs.forEach(function (t) {
      var a = Number(t.amount || 0), outgoing = t.direction === "outgoing";
      if (t.type === "cheque") {
        if (t.status === "open") { if (outgoing) chequeOutOpen += a; else chequeInOpen += a; }
        else if (t.status === "cashed") { if (outgoing) cashOut += a; else cashIn += a; }

function paymentTxs() {
  return db.transactions.filter(function (t) { return t.type !== "cheque"; });

function statusBadge(t) {
  if (t.type !== "cheque") return "";
  if (t.status === "cashed") return '<span class="badge b-green">واصل</span>';
  if (t.status === "bounced") return '<span class="badge b-red">برگشتی</span>';
  var d = daysTo(t.dueDate);
  if (d === null) return '<span class="badge b-gray">در جریان</span>';
  if (d < 0) return '<span class="badge b-red">' + money(-d) + ' روز گذشته</span>';
  if (d === 0) return '<span class="badge b-amber">امروز</span>';
  return '<span class="badge b-blue">' + money(d) + ' روز مانده</span>';
}
function dirBadge(t) {
  return t.direction === "outgoing"
    ? '<span class="badge b-red">پرداختی</span>'
    : '<span class="badge b-green">دریافتی</span>';
}
function typeBadgeTx(t) {
  return '<span class="badge ' + (t.type === "cheque" ? "b-amber" : "b-blue") + '">' + TX_TYPES[t.type] + '</span>';
}
function accountLabel(id) {
  for (var i = 0; i < db.accounts.length; i++) {
    var a = db.accounts[i];
    if (a.id === id) return (a.alias || a.bank || "حساب") + (a.bank ? " — " + a.bank : "");
  }
  return "—";
}
function accountOptions(sel) {
  return db.accounts.map(function (a) {
    return '<option value="' + a.id + '"' + (a.id === sel ? " selected" : "") + ">" +
      esc((a.alias || a.bank || "حساب") + (a.bank ? " — " + a.bank : "")) + "</option>";
  }).join("");
}

      var v = db.invoices.find(function (x) { return x.id === editingInvoiceId; });

        v.personId = $("#i-person").value || null;
        v.date = readIso("#i-date") || v.date || today();
        v.dueDate = readIso("#i-due") || null;
        v.note = $("#i-note").value.trim();
        v.items = draftItems.slice();
        v.supervisionPercent = sp;
        save();
        toast("فاکتور " + (v.number ? money(v.number) : "") + " ویرایش شد.");
      }
      editingInvoiceId = null; draftItems = [];
      viewInvoice();
      return;
    }
    db.seq += 1;
    var inv = {
      id: uid(), number: db.seq, tracking: tracking(), personId: $("#i-person").value || null,
      date: readIso("#i-date") || today(), dueDate: readIso("#i-due") || null,
      note: $("#i-note").value.trim(), items: draftItems.slice(), paid: false,
      supervisionPercent: sp
    };
    db.invoices.unshift(inv);
    draftItems = [];
    save();
    toast("فاکتور " + inv.number + " ذخیره شد. کد پیگیری: " + inv.tracking);
    viewInvoice();
  };
  function startEditInvoice(id) {
    var v = db.invoices.find(function (x) { return x.id === id; });
    if (!v) return;
    draftItems = v.items.map(function (i) { return { title: i.title, amount: Number(i.amount || 0), qty: Number(i.qty || 1) || 1 }; });
    editingInvoiceId = id;
    viewInvoice();
    $("#i-person").value = v.personId || "";
    $("#i-sup").value = v.supervisionPercent != null ? String(v.supervisionPercent) : "";
    $("#i-note").value = v.note || "";
    setJalali("#i-date", v.date || today());
    setJalali("#i-due", v.dueDate || "");
    buildDl();
    renderDraft();
    window.scrollTo(0, 0);
  }

  var list = $("#inv-list");
  list.innerHTML = db.invoices.length ? '<div class="tblwrap"><table><thead><tr>' +
    "<th>شماره</th><th>کد پیگیری</th><th>شخص</th><th>تاریخ</th><th>سررسید</th><th>مبلغ (ریال)</th><th>وضعیت</th><th>عملیات</th>" +
    "</tr></thead><tbody>" + db.invoices.map(function (v) {
      var sum = v.items.reduce(function (s, i) { return s + Number(i.amount || 0) * (Math.max(1, Number(i.qty || 1) || 1)); }, 0);
      var url = shareUrl(v);
      return "<tr><td><b>" + (v.number ? "فاکتور-" + money(v.number) : "فاکتور") + "</b></td>" +
        "<td><span class='mono'>" + v.tracking + "</span></td><td>" + esc(personName(v.personId)) +
        "</td><td>" + faDate(v.date) + "</td><td>" + (v.dueDate ? faDate(v.dueDate) : "—") + "</td><td class='num'>" + money(sum) + "</td><td>" +
        (v.paid ? '<span class="badge b-green">پرداخت شده</span>' : '<span class="badge b-amber">پرداخت نشده</span>') +
        "</td><td><div style='display:flex;gap:6px;flex-wrap:wrap'>" +
        "<button class='btn ghost sm' data-editinv='" + v.id + "'>ویرایش</button>" +
        "<button class='btn ghost sm' data-share='" + v.id + "'>کپی لینک پرداخت</button>" +
        "<button class='btn ghost sm' data-print='" + v.id + "'>چاپ</button>" +
        "<button class='btn ghost sm' data-paid='" + v.id + "'>" + (v.paid ? "ناتمام" : "پرداخت شد") + "</button>" +
        "<button class='btn icon sm' data-del='" + v.id + "'>حذف</button></div></td></tr>";
    }).join("") + "</tbody></table></div>" : '<div class="empty">هنوز فاکتوری صادر نشده است.</div>';

  list.querySelectorAll("[data-editinv]").forEach(function (b) {
    b.onclick = function () { startEditInvoice(b.dataset.editinv); };
  });
  list.querySelectorAll("[data-share]").forEach(function (b) {
    b.onclick = function () {
      var v = db.invoices.find(function (x) { return x.id === b.dataset.share; });
      var url = shareUrl(v);
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () {
        toast("لینک پرداخت کپی شد.");
      }, function () { prompt("لینک پرداخت:", url); });
      else prompt("لینک پرداخت:", url);
    };
  });
  list.querySelectorAll("[data-print]").forEach(function (b) {
    b.onclick = function () {
      var v = db.invoices.find(function (x) { return x.id === b.dataset.print; });
      renderShare(encodeInvoice(v));
      setTimeout(function () { window.print(); }, 300);
    };
  });
  list.querySelectorAll("[data-paid]").forEach(function (b) {
    b.onclick = function () {
      var v = db.invoices.find(function (x) { return x.id === b.dataset.paid; });
      v.paid = !v.paid; save(); viewInvoice();
    };
  });
  list.querySelectorAll("[data-del]").forEach(function (b) {
    b.onclick = function () {
      if (!confirm("آیا از حذف این فاکتور و تمام آیتم‌های آن مطمئن هستید؟")) return;
      db.invoices = db.invoices.filter(function (x) { return x.id !== b.dataset.del; });
      save(); toast("فاکتور حذف شد."); viewInvoice();
    };
  });
  bindJalaliInputs();
}

function encodeInvoice(v) {
  /* The customer's browser has no localStorage of the owner — everything the
     payment page needs travels inside the URL itself. */
  var pr = {
    name: db.profile.name || "", bank: db.profile.bank || "",
    sheba: db.profile.sheba || "", card: db.profile.card || "",
    phone: db.profile.phone || "", payNote: db.profile.payNote || "",
    socials: db.profile.socials || {},
    accounts: db.accounts || []
  };
  var payload = {
    t: v.tracking, n: v.number || null, d: v.date, dd: v.dueDate || null, p: personName(v.personId),
    nt: v.note || "",
    items: v.items, pd: v.paid ? 1 : 0, sp: v.supervisionPercent != null ? Number(v.supervisionPercent) : null, pr: pr
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function shareUrl(v) {
  return location.origin + location.pathname + "#/share/" + encodeURIComponent(encodeInvoice(v));
}
function decodeInvoice(code) {
  try { return JSON.parse(decodeURIComponent(escape(atob(code)))); }
  catch (e) { return null; }
}

            v.items.map(function (i) {

            }).join("") +

            (supAmt ? "<tr><td><b>مبلغ نظارت (" + faPercent(sp) + "٪ از خرج کرد)</b></td><td class='num'>" + money(supAmt) + "</td></tr>" +

/* ================= reports ================= */
function viewReports() {
  var p = today().split("-");
  var j = g2j(+p[0], +p[1], +p[2]);
  var ys = j2g(j[0], 1, 1);
  var defFrom = isoOf(new Date(ys[0], ys[1] - 1, ys[2]));

  $("#view").innerHTML =
    '<div class="card"><h2>بازه گزارش</h2>' +
      '<div class="row">' +
        '<div><label>از تاریخ</label><input id="r-from" class="jdate" inputmode="numeric" placeholder="۱۴۰۵/۰۱/۰۱"></div>' +
        '<div><label>تا تاریخ</label><input id="r-to" class="jdate" inputmode="numeric" placeholder="۱۴۰۵/۱۲/۲۹"></div>' +
        '<div><label>شخص</label><select id="r-person"><option value="">همه</option>' + personOptions() + "</select></div>" +
        '<div class="fit"><button class="btn ghost sm" id="r-year">امسال</button></div>' +
        '<div class="fit"><button class="btn ghost sm" id="r-all">همه زمان‌ها</button></div>' +
      "</div>" +
    "</div>" +
    '<div id="report-body"></div>';

  setJalali("#r-from", defFrom);
  setJalali("#r-to", today());

  function compute() {
    var from = readIso("#r-from"), to = readIso("#r-to"), person = $("#r-person").value;
    function inR(d) { return !!d && (!from || d >= from) && (!to || d <= to); }
    var entries = db.entries.filter(function (e) {
      return inR(e.date) && (!person || e.personId === person);
    });
    var cheques = chequeTxs().filter(function (c) {
      return inR(c.dueDate) && (!person || c.personId === person);
    });
    var payments = paymentTxs().filter(function (x) {
      return inR(x.date) && (!person || x.personId === person);
    });
    var invoices = db.invoices.filter(function (i) {
      return inR(i.date) && (!person || i.personId === person);
    });
    return { from: from, to: to, entries: entries, cheques: cheques, payments: payments, invoices: invoices };
  }

  function renderBody() {
    var d = compute();
    var t = totals(d.entries);
    var payIn = d.payments.filter(function (x) { return x.direction !== "outgoing"; });
    var paySum = payIn.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
    var payCash = payIn.filter(function (x) { return x.type === "cash"; })
      .reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
    var payOut = d.payments.filter(function (x) { return x.direction === "outgoing"; })
      .reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
    var chCashed = d.cheques.filter(function (c) { return c.status === "cashed"; })
      .reduce(function (s, c) { return s + Number(c.amount || 0); }, 0);
    var invSum = d.invoices.reduce(function (s, i) {
      return s + i.items.reduce(function (ss, it) { return ss + Number(it.amount || 0) * (Math.max(1, Number(it.qty || 1) || 1)); }, 0);
    }, 0);

    /* monthly breakdown inside the range */
    var byMonth = {};
    d.entries.forEach(function (e) {
      var k = faMonthKey(e.date);
      if (!byMonth[k]) byMonth[k] = { income: 0, expense: 0 };
      byMonth[k][e.type === "income" ? "income" : "expense"] += Number(e.amount || 0);
    });
    var months = Object.keys(byMonth);

    /* per-person breakdown */
    var byPerson = {};
    d.entries.forEach(function (e) {
      var k = e.personId || "none";
      if (!byPerson[k]) byPerson[k] = { name: personName(e.personId), income: 0, expense: 0, n: 0 };
      byPerson[k][e.type === "income" ? "income" : "expense"] += Number(e.amount || 0);
      byPerson[k].n += 1;
    });
    var persons = Object.keys(byPerson).map(function (k) { return byPerson[k]; })
      .sort(function (a, b) { return (b.income + b.expense) - (a.income + a.expense); });
    var maxPerson = persons.length ? Math.max.apply(null, persons.map(function (x) { return x.income + x.expense; })) : 1;

    /* per-معین breakdown — معین comes from the person attached to the entry */
    var byCatAcc = {};
    d.entries.forEach(function (e) {
      var per = e.personId ? db.people.find(function (x) { return x.id === e.personId; }) : null;
      var cid = (per && per.catId) || "none";
      if (!byCatAcc[cid]) byCatAcc[cid] = { name: catName(cid) || "بدون معین", income: 0, expense: 0, n: 0 };
      byCatAcc[cid][e.type === "income" ? "income" : "expense"] += Number(e.amount || 0);
      byCatAcc[cid].n += 1;
    });
    var catRows = Object.keys(byCatAcc).map(function (k) { return byCatAcc[k]; })
      .sort(function (a, b) { return (b.income + b.expense) - (a.income + a.expense); });

    /* per-تفصیلی breakdown — each person is a تفصیلی */
    var byTaf = {};
    d.entries.forEach(function (e) {
      var lbl = personName(e.personId);
      if (!byTaf[lbl]) byTaf[lbl] = { name: lbl, income: 0, expense: 0, n: 0 };
      byTaf[lbl][e.type === "income" ? "income" : "expense"] += Number(e.amount || 0);
      byTaf[lbl].n += 1;
    });
    var tafRows = Object.keys(byTaf).map(function (k) { return byTaf[k]; })
      .sort(function (a, b) { return (b.income + b.expense) - (a.income + a.expense); });

    $("#report-body").innerHTML =
      '<div class="grid4" style="margin-bottom:16px">' +
        '<div class="stat income"><div class="t">دریافتی دوره</div><div class="v">' + money(t.income) + '</div></div>' +
        '<div class="stat expense"><div class="t">هزینه دوره</div><div class="v">' + money(t.expense) + '</div></div>' +
        '<div class="stat balance"><div class="t">مانده دوره</div><div class="v">' + money(t.balance) + '</div></div>' +
        '<div class="stat"><div class="t">فاکتورهای دوره</div><div class="v">' + money(invSum) + '</div></div>' +
      "</div>" +
      '<div class="card"><h2>گردش حساب دوره</h2>' +
        '<div class="row" style="align-items:center">' +
          '<div><span class="badge b-green">چک واصل‌شده</span> <b class="num">' + money(chCashed) + '</b></div>' +
          '<div><span class="badge b-blue">دریافت نقدی/بانکی</span> <b class="num">' + money(paySum) + '</b> <span class="hint">(نقدی: ' + money(payCash) + ')</span></div>' +
          '<div><span class="badge b-red">پرداخت نقدی/بانکی</span> <b class="num">' + money(payOut) + '</b></div>' +
          '<div><span class="badge b-amber">چک‌های سررسیدشده</span> <b class="num">' + money(d.cheques.length) + '</b></div>' +
        "</div>" +
      "</div>" +
      '<div class="card"><h2>روند ماهانه دوره</h2>' +
        (months.length ? '<div class="tblwrap"><table class="month-tbl"><thead><tr>' +
          "<th>ماه</th><th>دریافتی (ریال)</th><th>هزینه (ریال)</th><th>مانده (ریال)</th></tr></thead><tbody>" +
          months.map(function (k) {
            var m = byMonth[k];
            return "<tr><td>" + esc(k) + "</td><td class='num' style='color:var(--green)'>" + money(m.income) +
              "</td><td class='num' style='color:var(--red)'>" + money(m.expense) +
              "</td><td class='num'>" + money(m.income - m.expense) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">در این بازه آیتمی ثبت نشده است.</div>') +
      "</div>" +
      '<div class="card"><h2>تفکیک بر اساس شخص</h2>' +
        (persons.length ? '<div class="tblwrap"><table><thead><tr>' +
          "<th>شخص</th><th>آیتم‌ها</th><th>دریافتی (ریال)</th><th>هزینه (ریال)</th><th style='width:30%'>سهم</th></tr></thead><tbody>" +
          persons.map(function (x) {
            var w = Math.round(100 * (x.income + x.expense) / maxPerson);
            return "<tr><td>" + esc(x.name) + "</td><td>" + money(x.n) +
              "</td><td class='num' style='color:var(--green)'>" + money(x.income) +
              "</td><td class='num' style='color:var(--red)'>" + money(x.expense) +
              "</td><td><div style='background:var(--accent-soft);border-radius:999px;height:10px;overflow:hidden'>" +
              "<div style='background:var(--accent);height:100%;width:" + w + "%'></div></div></td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">داده‌ای برای تفکیک وجود ندارد.</div>') +
      "</div>" +
      '<div class="card"><h2>تفکیک بر اساس معین</h2>' +
        (catRows.length ? '<div class="tblwrap"><table><thead><tr>' +
          "<th>حساب معین</th><th>اسناد</th><th>دریافتی (ریال)</th><th>هزینه (ریال)</th><th>مانده (ریال)</th></tr></thead><tbody>" +
          catRows.map(function (x) {
            return "<tr><td>" + esc(x.name) + "</td><td>" + money(x.n) +
              "</td><td class='num' style='color:var(--green)'>" + money(x.income) +
              "</td><td class='num' style='color:var(--red)'>" + money(x.expense) +
              "</td><td class='num'>" + money(x.income - x.expense) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">معینی برای تفکیک ثبت نشده است.</div>') +
      "</div>" +
      '<div class="card"><h2>تفکیک بر اساس تفصیلی</h2>' +
        (tafRows.length ? '<div class="tblwrap"><table><thead><tr>' +
          "<th>حساب تفصیلی</th><th>اسناد</th><th>دریافتی (ریال)</th><th>هزینه (ریال)</th><th>مانده (ریال)</th></tr></thead><tbody>" +
          tafRows.map(function (x) {
            return "<tr><td>" + esc(x.name) + "</td><td>" + money(x.n) +
              "</td><td class='num' style='color:var(--green)'>" + money(x.income) +
              "</td><td class='num' style='color:var(--red)'>" + money(x.expense) +
              "</td><td class='num'>" + money(x.income - x.expense) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">داده‌ای برای تفکیک وجود ندارد.</div>') +
      "</div>" +
      '<div class="card"><h2>آیتم‌های دوره <span class="hint">(' + money(d.entries.length) + ' مورد)</span></h2>' +
        '<div class="actions noprint" style="margin:0 0 12px"><button class="btn ghost sm" id="r-csv">دانلود اکسل (CSV)</button></div>' +
        '<div id="report-list"></div>' +
      "</div>";

    $("#report-list").innerHTML = d.entries.length ? '<div class="tblwrap"><table><thead><tr>' +
      "<th>نوع</th><th>نام آیتم</th><th>معین</th><th>شخص</th><th>مبلغ (ریال)</th><th>تاریخ</th>" +
      "</tr></thead><tbody>" + d.entries.slice(0, 150).map(function (e) {
        var per = e.personId ? db.people.find(function (x) { return x.id === e.personId; }) : null;
        return "<tr><td>" + typeBadge(e.type) + "</td><td>" + esc(e.title) +
          "</td><td>" + esc(per && per.catId ? (catName(per.catId) || "—") : "—") +
          "</td><td>" + esc(e.personId ? personName(e.personId) : "—") +
          "</td><td class='num'>" + money(e.amount) + "</td><td>" + faDate(e.date) +
          "</td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="empty">—</div>';

    $("#r-csv").onclick = function () {
      var rows = [["نوع", "نام آیتم", "معین", "شخص", "مبلغ (ریال)", "تاریخ", "کد پیگیری"]];
      d.entries.forEach(function (e) {
        var per = e.personId ? db.people.find(function (x) { return x.id === e.personId; }) : null;
        rows.push([e.type === "income" ? "دریافتی" : "هزینه", e.title,
          (per && per.catId) ? (catName(per.catId) || "") : "", personName(e.personId),
          e.amount, e.date, e.tracking]);
      });
      var csv = "\uFEFF" + rows.map(function (r) {
        return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
      }).join("\r\n");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      a.download = "report.csv";
      a.click();
      toast("فایل CSV دانلود شد.");
    };
  }

  ["#r-from", "#r-to", "#r-person"].forEach(function (s) {
    $(s).addEventListener("input", renderBody);
  });
  $("#r-year").onclick = function () {
    var p2 = today().split("-");
    var jj = g2j(+p2[0], +p2[1], +p2[2]);
    var a = j2g(jj[0], 1, 1);
    setJalaliFromIso($("#r-from"), isoOf(new Date(a[0], a[1] - 1, a[2])));
    setJalaliFromIso($("#r-to"), today());
    renderBody();
  };
  $("#r-all").onclick = function () {
    setJalali("#r-from", ""); setJalali("#r-to", ""); renderBody();
  };
  renderBody();
  bindJalaliInputs();
}

/* ================= settings ================= */
function viewSettings() {
  var p = db.profile;
  var so = p.socials || {};
  $("#view").innerHTML =
    '<div class="card"><h2>مدیریت پروفایل</h2>' +
      '<p class="hint">این اطلاعات در صفحه پرداخت فاکتور (لینک اشتراک‌گذاری‌شده) نمایش داده می‌شود.</p>' +
      '<div class="grid2">' +
        '<div><label>نام صاحب حساب</label><input id="s-name" value="' + esc(p.name) + '"></div>' +
        '<div><label>شماره تماس</label><input id="s-phone" inputmode="tel" value="' + esc(p.phone) + '"></div>' +
        '<div><label>شماره شبا (بدون IR)</label><input id="s-sheba" inputmode="numeric" value="' + esc(p.sheba || "") + '" placeholder="019000000000000000000001"></div>' +
        '<div><label>شماره کارت</label><input id="s-card" inputmode="numeric" value="' + esc(p.card || "") + '" placeholder="6037…"></div>' +
        '<div><label>نام بانک (نمایش در فاکتور)</label><input id="s-bank" value="' + esc(p.bank || "") + '" placeholder="مثلاً بانک ملت"></div>' +
        '<div><label>درصد نظارت پیش‌فرض فاکتورها</label><input id="s-sup" inputmode="numeric" value="' + esc(Number(db.supervisionPercent) || 0) + '" placeholder="مثلاً 12"></div>' +
      "</div>" +
      '<div style="margin-top:12px"><label>پیام راهنمای پرداخت (از {phone} برای شماره تماس استفاده کنید)</label>' +
        '<textarea id="s-note" rows="2">' + esc(p.payNote) + "</textarea></div>" +
      '<div class="actions"><button class="btn" id="s-save">ذخیره</button></div>' +
    "</div>" +
    '<div class="card"><h2>پشتیبان‌گیری از داده‌ها</h2>' +
      '<p class="hint">تمام داده‌ها فقط داخل همین مرورگر ذخیره می‌شوند. برای انتقال به دستگاه دیگر از خروجی/ورودی JSON استفاده کنید.</p>' +
      '<div class="actions">' +
        '<button class="btn ghost" id="s-export">دانلود خروجی (JSON)</button>' +
        '<button class="btn ghost" id="s-import">بازیابی از فایل</button>' +
        '<input type="file" id="s-file" accept=".json" style="display:none">' +
      "</div>" +
      '<hr style="margin:14px 0 12px;border:none;border-top:1px dashed var(--border)">' +
      '<div class="row" style="align-items:center">' +
        '<div><label>خروجی JSON آخرین بار</label><div class="hint" id="s-bk-date"></div></div>' +
        '<div style="flex:1"></div>' +
        '<div class="fit"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="s-ab-on"> نسخه محلی خودکار (روزانه)</label></div>' +
      "</div>" +
      '<p class="hint" id="s-ab-info" style="margin-top:8px"></p>' +
      '<div class="actions"><button class="btn ghost" id="s-ab-restore">♻️ بازیابی نسخه محلی خودکار</button></div>' +
    "</div>" +
    '<div class="card"><h2>حساب‌های بانکی من</h2>' +
      '<p class="hint">همه حساب‌ها در صفحه پرداخت مشتری (لینک فاکتور) با دکمه کپی نمایش داده می‌شوند. پرداخت‌های واریزی هم به یک حساب لینک می‌شوند.</p>' +
      '<div class="row">' +
        '<div><label>نام مستعار</label><input id="a-alias" placeholder="مثلاً جاری شرکت"></div>' +
        '<div><label>بانک</label><input id="a-bank" list="bank-list-s" placeholder="بانک…"><datalist id="bank-list-s">' +
          IRAN_BANKS.map(function (b) { return '<option value="' + b + '">'; }).join("") + "</datalist></div>" +
        '<div><label>شماره شبا (بدون IR)</label><input id="a-sheba" inputmode="numeric"></div>' +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
        '<div><label>شماره حساب</label><input id="a-acc" inputmode="numeric"></div>' +
        '<div><label>شماره کارت</label><input id="a-card" inputmode="numeric"></div>' +
        '<div class="fit"><button class="btn" id="a-add">افزودن حساب</button></div>' +
      "</div>" +
      '<div id="accounts-list" style="margin-top:12px"></div>' +
    "</div>" +
    '<div class="card"><h2>شبکه‌های اجتماعی من</h2>' +
      '<p class="hint">در پایین صفحه پرداخت مشتری نمایش داده می‌شوند.</p>' +
      '<div class="grid2">' +
        '<div><label>اینستاگرام (نام کاربری)</label><input id="so-instagram" value="' + esc(so.instagram || "") + '" placeholder="username"></div>' +
        '<div><label>تلگرام (نام کاربری بدون @)</label><input id="so-telegram" value="' + esc(so.telegram || "") + '" placeholder="username"></div>' +
        '<div><label>واتساپ (شماره با کد کشور)</label><input id="so-whatsapp" value="' + esc(so.whatsapp || "") + '" placeholder="98912…"></div>' +
        '<div><label>وب‌سایت</label><input id="so-site" value="' + esc(so.site || "") + '" placeholder="https://…"></div>' +
      "</div>" +
      '<div class="actions"><button class="btn" id="so-save">ذخیره</button></div>' +
    "</div>" +
    '<div class="card"><h2 style="color:var(--red)">پاک کردن همه داده‌ها</h2>' +
      '<div class="actions"><button class="btn red" id="s-reset">پاک کردن کامل</button></div>' +
    "</div>";

  $("#s-save").onclick = function () {
    db.profile = {
      name: $("#s-name").value.trim(), phone: $("#s-phone").value.trim(),
      sheba: $("#s-sheba").value.trim(), card: $("#s-card").value.trim(),
      bank: $("#s-bank").value.trim(),
      payNote: $("#s-note").value.trim()
    };
    db.supervisionPercent = Math.max(0, Math.min(100, Number(digitsOnly($("#s-sup").value)) || 0));
    save(); toast("ذخیره شد.");
  };
  $("#s-export").onclick = function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }));
    a.download = "invoice-manager-backup.json";
    a.click();
    try { localStorage.setItem("inv_lastfile_bk", today()); } catch (e) {}
    var s = $("#s-bk-date");
    if (s) s.textContent = faDate(today());
    toast("فایل پشتیبان دانلود شد.");
  };
  $("#s-import").onclick = function () { $("#s-file").click(); };
  $("#s-file").onchange = function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        restoreBackup(d, "فایل پشتیبان");
      } catch (e) { toast("فایل JSON معتبری نیست."); }
    };
    r.readAsText(f);
  };
  /* پشتیبان محلی خودکار — بازیابی/تغییر وضعیت */
  var snap = autoBackupSnapshot();
  var bfDate = backupFileDateISO();
  $("#s-bk-date").textContent = bfDate ? faDate(bfDate) : "هرگز";
  $("#s-ab-on").checked = db.autoBackup !== false;
  $("#s-ab-info").textContent = snap
    ? "آخرین نسخه محلی: " + faDate(snap.d) + " (" + money(JSON.stringify(snap.data).length) + " بایت)"
    : "هنوز نسخه محلی ساخته نشده است — با باز کردن برنامه ساخته می‌شود.";
  $("#s-ab-on").onchange = function () {
    db.autoBackup = $("#s-ab-on").checked;
    save(); toast(db.autoBackup ? "نسخه محلی خودکار فعال شد." : "نسخه محلی خودکار خاموش شد.");
    autoBackupTick();
  };
  $("#s-ab-restore").onclick = function () {
    var s = autoBackupSnapshot();
    if (!s || !s.data) { toast("نسخه محلی‌ای برای بازیابی نیست."); return; }
    restoreBackup(s.data, "نسخه محلی " + faDate(s.d));
  };
  $("#so-save").onclick = function () {
    db.profile.socials = {
      instagram: $("#so-instagram").value.trim().replace(/^@/, ""),
      telegram: $("#so-telegram").value.trim().replace(/^@/, ""),
      whatsapp: $("#so-whatsapp").value.trim(),
      site: $("#so-site").value.trim()
    };
    save(); toast("ذخیره شد.");
  };

  function accountList() {
    $("#accounts-list").innerHTML = db.accounts.length ? '<div class="tblwrap"><table><thead><tr>' +
      "<th>نام مستعار</th><th>بانک</th><th>شبا</th><th>کارت</th><th></th></tr></thead><tbody>" +
      db.accounts.map(function (a) {
        return "<tr><td><b>" + esc(a.alias || "—") + "</b></td><td>" + esc(a.bank || "—") +
          "</td><td class='mono'>" + esc(a.sheba ? "IR" + a.sheba : "—") +
          "</td><td class='mono'>" + esc(a.card || "—") + "</td>" +
          "<td><button class='btn icon sm' data-adel='" + a.id + "'>حذف</button></td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="hint">هنوز حسابی اضافه نشده است. (شبا/کارت پروفایل به‌عنوان حساب پیش‌فرض نمایش داده می‌شود.)</div>';
    $("#accounts-list").querySelectorAll("[data-adel]").forEach(function (b) {
      b.onclick = function () {
        if (!confirm("حذف این حساب بانکی؟")) return;
        db.accounts = db.accounts.filter(function (x) { return x.id !== b.dataset.adel; });
        save(); toast("حساب حذف شد."); accountList();
      };
    });
  }
  accountList();
  $("#a-add").onclick = function () {
    var sheba = $("#a-sheba").value.trim();
    var card = $("#a-card").value.trim();
    if (!sheba && !card) { toast("شبا یا شماره کارت را وارد کنید."); return; }
    if (sheba && !/^\d{24}$/.test(sheba)) { toast("شبا باید ۲۴ رقم بدون IR باشد."); return; }
    db.accounts.push({
      id: uid(), alias: $("#a-alias").value.trim(), bank: $("#a-bank").value.trim(),
      sheba: sheba, accNumber: $("#a-acc").value.trim(), card: card
    });
    save(); toast("حساب اضافه شد."); accountList();
    $("#a-alias").value = ""; $("#a-bank").value = ""; $("#a-sheba").value = "";
    $("#a-acc").value = ""; $("#a-card").value = "";
  };

  $("#s-reset").onclick = function () {
    if (!confirm("آیا از پاک کردن تمام داده‌ها (آیتم‌ها، چک‌ها، فاکتورها و اشخاص) مطمئن هستید؟ این کار قابل بازگشت نیست.")) return;
    if (!confirm("مطمئن هستید؟")) return;
    db = defaultData(); save(); toast("تمام داده‌ها پاک شد."); go("dashboard");
  };
}

/* ---------- boot ---------- */
$("#gform").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var v = $("#gsearch").value.trim();
  if (v) go("search/" + encodeURIComponent(v));
});
window.addEventListener("keydown", function (ev) {
  var tag = (ev.target.tagName || "").toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === "k" || ev.key === "K")) {
    ev.preventDefault(); $("#gsearch").focus(); $("#gsearch").select();
  } else if (ev.key === "/" && !ev.ctrlKey && !ev.metaKey && tag !== "input" && tag !== "textarea" && tag !== "select") {
    ev.preventDefault(); $("#gsearch").focus(); $("#gsearch").select();
  }
});
$("#theme-btn").onclick = function () {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("invoice_theme", next); } catch (e) {}
};
if (!location.hash) location.hash = "#/dashboard";
render();
</script>
