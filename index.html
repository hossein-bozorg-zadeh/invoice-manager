<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت فاکتور</title>
<meta name="description" content="مدیریت فاکتور، دریافتی و هزینه‌ها، چک‌ها و کارمندان — کاملاً داخل مرورگر شما">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#69718a;
  --border:#e4e8f2; --accent:#3b6ef5; --accent-soft:#eaf0ff;
  --green:#189a68; --green-soft:#e4f6ee; --red:#d64545; --red-soft:#fdeaea;
  --amber:#b97d10; --amber-soft:#fcf2df; --shadow:0 6px 20px rgba(28,35,51,.07);
}
html[data-theme="dark"]{
  --bg:#0e1220; --card:#161b2c; --text:#e8ecf8; --muted:#939cbb;
  --border:#262d44; --accent:#6d95ff; --accent-soft:#1d2745;
  --green:#3fce97; --green-soft:#12301f; --red:#ff7a7a; --red-soft:#3a1a1a;
  --amber:#eab24a; --amber-soft:#372a10; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.7 Vazirmatn,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--card);color:var(--text);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
a{color:var(--accent);text-decoration:none}

/* header */
header{background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20}
.hbar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo .ic{width:34px;height:34px;border-radius:10px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:16px}
.hbar .spacer{margin-inline-start:auto}
#theme-btn{border:1px solid var(--border);background:transparent;border-radius:9px;
  padding:6px 10px;color:var(--muted);font-size:15px}
#theme-btn:hover{color:var(--accent);border-color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap;order:3;width:100%;overflow-x:auto}
@media(min-width:760px){nav{width:auto;order:0;margin-inline-start:auto;overflow:visible}}
nav button{border:none;background:transparent;color:var(--muted);
  padding:7px 13px;border-radius:9px;font-weight:500;font-size:14px;white-space:nowrap}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff}

/* cards + layout */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:130px}
.row>.fit{flex:0 0 auto;min-width:0}

.stat{border-radius:16px;padding:16px;border:1px solid var(--border)}
.stat .t{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat.income{background:var(--green-soft);border-color:transparent}
.stat.income .v{color:var(--green)}
.stat.expense{background:var(--red-soft);border-color:transparent}
.stat.expense .v{color:var(--red)}
.stat.balance{background:var(--accent-soft);border-color:transparent}
.stat.balance .v{color:var(--accent)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;
  padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}
.num{font-weight:700;white-space:nowrap}
td.num,th.num{text-align:left;direction:ltr}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-gray{background:var(--bg);color:var(--muted)}
.mono{font-family:monospace;direction:ltr;display:inline-block}

/* buttons */
.btn{border:none;border-radius:10px;padding:9px 18px;font-weight:600;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn.icon{background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 10px}
.btn.icon:hover{color:var(--red);border-color:var(--red)}
.btn.icon.blue:hover{color:var(--accent);border-color:var(--accent)}

/* misc */
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);
  background:var(--text);color:var(--bg);padding:10px 22px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:1}
.hint{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backlink{display:inline-block;margin-bottom:10px;font-size:13.5px}
.month-tbl td,.month-tbl th{text-align:center}
.month-tbl td:first-child,.month-tbl th:first-child{text-align:right}

/* Jalali date picker popup */
.jpicker{position:fixed;z-index:60;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);padding:12px;width:266px;display:none;user-select:none}
.jpicker .jp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.jpicker .jp-head b{font-size:14px}
.jpicker .jp-nav{border:none;background:transparent;color:var(--muted);font-size:16px;padding:2px 10px;border-radius:8px}
.jpicker .jp-nav:hover{background:var(--accent-soft);color:var(--accent)}
.jpicker .jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.jpicker .jp-wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.jpicker .jp-day{text-align:center;padding:6px 0;border-radius:8px;font-size:13px;cursor:pointer}
.jpicker .jp-day:hover{background:var(--accent-soft)}
.jpicker .jp-day.sel{background:var(--accent);color:#fff;font-weight:700}
.jpicker .jp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.jpicker .jp-foot{display:flex;justify-content:space-between;margin-top:8px}
.jpicker .jp-foot button{border:none;background:transparent;color:var(--accent);font-size:13px;padding:4px 8px;border-radius:8px}
.jpicker .jp-foot button:hover{background:var(--accent-soft)}

/* invoice share page */
.inv{max-width:720px;margin:0 auto}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px dashed var(--border);padding-bottom:14px;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.pay-line{display:flex;gap:10px;align-items:center;background:var(--bg);
  border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:8px 0}
@media print{
  header,.noprint,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:none;padding:0}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo"><span class="ic">🧾</span><span id="app-title">مدیریت فاکتور</span></div>
    <button id="theme-btn" title="تغییر تم" aria-label="تغییر تم">🌙</button>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   مدیریت فاکتور — a fully client-side invoice & finance manager.
   Persian / RTL. All data lives in localStorage; nothing leaves
   the browser. Shared invoices are encoded into the URL itself.
   ============================================================ */

var STORE_KEY = "invoice_manager_v1";
var $ = function (s) { return document.querySelector(s); };

/* ---------- storage ---------- */
function defaultData() {
  return {
    profile: {
      name: "", sheba: "", card: "", phone: "",
      payNote: "لطفاً پس از واریز، رسید پرداختی را به شماره {phone} ارسال نمایید."
    },
    people: [],   // {id, name, role: "employer"|"employee", phone}
    entries: [],  // {id, type:"income"|"expense", title, amount, date, personId, tracking}
    cheques: [],  // {id, number, amount, dueDate, personId, status:"open"|"cashed"|"bounced"}
    invoices: [], // {id, number, tracking, personId, date, items:[{title, amount}], paid}
    seq: 1000     // sequential invoice numbers
  };
}
function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultData();
    var d = JSON.parse(raw);
    var base = defaultData();
    for (var k in base) if (d[k] === undefined) d[k] = base[k];
    d.cheques.forEach(function (c) {
      if (!c.status) c.status = "open";
      if (!c.direction) c.direction = "incoming";
      if (!c.history) c.history = [];
    });
    return d;
  } catch (e) { return defaultData(); }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
var db = load();

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("#theme-btn").textContent = t === "dark" ? "☀️" : "🌙";
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.remove();
  meta = document.createElement("meta");
  meta.name = "theme-color";
  meta.content = t === "dark" ? "#0e1220" : "#f4f6fb";
  document.head.appendChild(meta);
}
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem("invoice_theme"); } catch (e) {}
  var t = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var m = document.createElement("meta"); m.name = "theme-color"; m.content = "#f4f6fb"; document.head.appendChild(m);
  applyTheme(t);
})();

/* ---------- helpers ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function tracking() {
  var s = "";
  for (var i = 0; i < 8; i++) s += Math.floor(Math.random() * 10);
  return s;
}
function money(n) { return Number(n || 0).toLocaleString("fa-IR"); }
/* live thousand-separator formatting for amount inputs */
function digitsOnly(s) { return String(s || "").replace(/[^\d]/g, ""); }
function bindAmountInput(el) {
  el.addEventListener("input", function () {
    var d = digitsOnly(el.value).slice(0, 15);
    el.value = d ? Number(d).toLocaleString("en-US").replace(/,/g, "٬") : "";
  });
}
function readAmount(el) { return Number(digitsOnly(el.value)) || 0; }
function today() { return new Date().toISOString().slice(0, 10); }
function faDate(iso) {
  if (!iso) return "—";
  return isoToJalaliStr(iso) || iso;
}
function faMonthKey(iso) {
  try { return new Date(iso).toLocaleDateString("fa-IR", { year: "numeric", month: "long" }); }
  catch (e) { return iso; }
}
function daysTo(iso) {
  var d = Math.ceil((new Date(iso) - new Date(today())) / 86400000);
  return isNaN(d) ? null : d;
}
function personName(id) {
  for (var i = 0; i < db.people.length; i++) if (db.people[i].id === id) return db.people[i].name;
  return "—";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
function personOptions(sel) {
  return db.people.map(function (p) {
    return '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + ">" +
      esc(p.name) + " (" + (p.role === "employer" ? "کارفرما" : "کارمند") + ")</option>";
  }).join("");
}
/* Enter key submits the form whose button is given */
function bindEnter(rootSel, btnSel) {
  $(rootSel).querySelectorAll("input,select").forEach(function (el) {
    el.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); $(btnSel).click(); }
    });
  });
}
function typeBadge(t) {
  return t === "income" ? '<span class="badge b-green">دریافتی</span>'
    : '<span class="badge b-red">هزینه</span>';
}

/* ---------- Jalali (Persian, Solar Hijri) calendar ----------
   Internal dates stay Gregorian ISO (YYYY-MM-DD); only the input UI
   and the popup calendar speak Jalali. */
function g2j(gy, gm, gd) {
  var g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + (~~((gy2 + 3) / 4)) - (~~((gy2 + 99) / 100)) +
    (~~((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * ~~(days / 12053); days %= 12053;
  jy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  var gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  var days = (365 * jy) + (~~(jy / 33) * 8) + (~~(((jy % 33) + 3) / 4)) + 78 + jd +
    ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * ~~(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * ~~(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var leap = ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0));
  var sal = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var gm;
  for (gm = 1; gm <= 12; gm++) { if (gd <= sal[gm]) break; gd -= sal[gm]; }
  return [gy, gm, gd];
}
function jDate(jy, jm, jd) { var g = j2g(jy, jm, jd); return new Date(g[0], g[1] - 1, g[2]); }
function jMonthLen(jy, jm) {
  var ny = (jm === 12) ? jy + 1 : jy, nm = (jm === 12) ? 1 : jm + 1;
  return Math.round((jDate(ny, nm, 1) - jDate(jy, jm, 1)) / 86400000);
}
function isoOf(d) {
  var p = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function faDig(s) { return String(s).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); }
function enDig(s) { return String(s).replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); }); }
function isoToJalaliStr(iso) {
  var p = String(iso || "").split("-");
  if (p.length !== 3) return "";
  var j = g2j(+p[0], +p[1], +p[2]);
  return faDig(j[0]) + "/" + faDig(String(j[1]).padStart(2, "0")) + "/" + faDig(String(j[2]).padStart(2, "0"));
}
function parseJalaliText(txt) {
  var m = enDig(txt || "").trim().match(/^(\d{3,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (!m) return null;
  var jy = +m[1], jm = +m[2], jd = +m[3];
  if (jm < 1 || jm > 12) return null;
  if (jd < 1 || jd > jMonthLen(jy, jm)) return null;
  var g = j2g(jy, jm, jd);
  return isoOf(new Date(g[0], g[1] - 1, g[2]));
}
function setJalali(sel, iso) {
  var el = $(sel);
  el.value = iso ? isoToJalaliStr(iso) : "";
  el.dataset.iso = iso || "";
  el.style.borderColor = "";
}
function readIso(sel) {
  var el = $(sel);
  if (el.dataset.iso) return el.dataset.iso;
  var parsed = parseJalaliText(el.value);
  if (parsed) el.dataset.iso = parsed;
  return parsed || "";
}

/* popup picker (one instance, re-targeted to the focused input) */
var JP_MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
  "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
var jpEl = null, jpInput = null, jpY = 0, jpM = 0;
function closePicker() { if (jpEl) jpEl.style.display = "none"; jpInput = null; }
function openPicker(input) {
  if (!jpEl) {
    jpEl = document.createElement("div");
    jpEl.className = "jpicker";
    document.body.appendChild(jpEl);
    document.addEventListener("mousedown", function (ev) {
      if (jpEl && jpEl.style.display === "block" && jpInput &&
        !jpEl.contains(ev.target) && ev.target !== jpInput) closePicker();
    });
  }
  jpInput = input;
  var base = parseJalaliText(input.value) || input.dataset.iso || today();
  var p = base.split("-");
  var j = g2j(+p[0], +p[1], +p[2]);
  jpY = j[0]; jpM = j[1];
  renderPicker();
  var r = input.getBoundingClientRect();
  jpEl.style.display = "block";
  var top = r.bottom + window.scrollY + 6;
  var left = Math.max(8, r.right + window.scrollX - jpEl.offsetWidth);
  jpEl.style.top = top + "px";
  jpEl.style.left = left + "px";
}
function renderPicker() {
  var len = jMonthLen(jpY, jpM);
  var offset = (jDate(jpY, jpM, 1).getDay() + 1) % 7; // شنبه first
  var selIso = jpInput ? (jpInput.dataset.iso || "") : "";
  var tIso = today();
  var html = '<div class="jp-head">' +
    '<button class="jp-nav" data-jp="prev">‹</button>' +
    "<b>" + JP_MONTHS[jpM - 1] + " " + faDig(jpY) + "</b>" +
    '<button class="jp-nav" data-jp="next">›</button></div>' +
    '<div class="jp-grid">' +
    ["ش", "ی", "د", "س", "چ", "پ", "ج"].map(function (w) { return '<div class="jp-wd">' + w + "</div>"; }).join("");
  for (var i = 0; i < offset; i++) html += "<div></div>";
  for (var d = 1; d <= len; d++) {
    var iso = isoOf(jDate(jpY, jpM, d));
    html += '<div class="jp-day' + (iso === selIso ? " sel" : "") + (iso === tIso ? " today" : "") +
      '" data-d="' + d + '">' + faDig(d) + "</div>";
  }
  html += "</div>" +
    '<div class="jp-foot"><button data-jp="clear">پاک کردن</button><button data-jp="today">امروز</button></div>';
  jpEl.innerHTML = html;

  jpEl.querySelectorAll("[data-jp]").forEach(function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      var act = b.dataset.jp;
      if (act === "prev") { jpM--; if (jpM < 1) { jpM = 12; jpY--; } renderPicker(); }
      else if (act === "next") { jpM++; if (jpM > 12) { jpM = 1; jpY++; } renderPicker(); }
      else if (act === "today") { setJalaliFromIso(jpInput, today()); closePicker(); }
      else if (act === "clear") { jpInput.value = ""; jpInput.dataset.iso = ""; closePicker(); }
    };
  });
  jpEl.querySelectorAll(".jp-day").forEach(function (cell) {
    cell.onclick = function (ev) {
      ev.stopPropagation();
      var d = +cell.dataset.d;
      var g = j2g(jpY, jpM, d);
      setJalaliFromIso(jpInput, isoOf(new Date(g[0], g[1] - 1, g[2])));
      closePicker();
    };
  });
}
function setJalaliFromIso(input, iso) {
  input.value = isoToJalaliStr(iso);
  input.dataset.iso = iso;
  input.style.borderColor = "";
}
function bindJalaliInputs() {
  document.querySelectorAll(".jdate").forEach(function (el) {
    el.readOnly = false;
    el.autocomplete = "off";
    el.addEventListener("focus", function () { openPicker(el); });
    el.addEventListener("click", function () { openPicker(el); });
    el.addEventListener("input", function () { el.dataset.iso = ""; el.style.borderColor = ""; });
    el.addEventListener("change", function () {
      if (el.value.trim() && !parseJalaliText(el.value)) {
        el.style.borderColor = "var(--red)";
        toast("تاریخ نامعتبر است — مثال: " + isoToJalaliStr(today()));
      }
    });
  });
}

/* ---------- routing ---------- */
var ROUTES = [
  ["dashboard", "داشبورد"],
  ["entries", "آیتم‌ها"],
  ["people", "کارمندان و کارفرما"],
  ["cheques", "چک‌ها"],
  ["invoice", "فاکتور"],
  ["settings", "تنظیمات"]
];
function route() {
  var h = location.hash.replace(/^#\/?/, "");
  return h || "dashboard";
}
function go(r) { location.hash = "#/" + r; }

function renderNav(active) {
  $("#nav").innerHTML = ROUTES.map(function (r) {
    return '<button data-r="' + r[0] + '"' + (r[0] === active ? ' class="active"' : "") + ">" + r[1] + "</button>";
  }).join("");
  $("#nav").querySelectorAll("button").forEach(function (b) {
    b.onclick = function () { go(b.dataset.r); };
  });
}

function render() {
  var r = route();
  if (r.indexOf("share/") === 0) { renderShare(decodeURIComponent(r.slice(6))); return; }
  var known = ["dashboard", "entries", "people", "cheques", "invoice", "settings"];
  if (known.indexOf(r) < 0) r = "dashboard";
  renderNav(r);
  ({ dashboard: viewDashboard, entries: viewEntries, people: viewPeople,
     cheques: viewCheques, invoice: viewInvoice, settings: viewSettings }[r])();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

/* ---------- totals ---------- */
function totals(list) {
  var inc = 0, exp = 0;
  (list || db.entries).forEach(function (e) {
    if (e.type === "income") inc += Number(e.amount || 0);
    else exp += Number(e.amount || 0);
  });
  return { income: inc, expense: exp, balance: inc - exp };
}
function isThisMonth(iso) {
  return faMonthKey(iso) === faMonthKey(today());
}

/* ================= dashboard ================= */
function viewDashboard() {
  var t = totals();
  var month = totals(db.entries.filter(function (e) { return isThisMonth(e.date); }));
  var recent = db.entries.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; }).slice(0, 8);
  var openCheques = db.cheques.filter(function (c) { return c.status === "open"; });
  var soonCheques = openCheques.filter(function (c) {
    var d = daysTo(c.dueDate); return d !== null && d <= 14;
  }).sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; }).slice(0, 5);
  var incomingOpen = openCheques.filter(function (c) { return c.direction !== "outgoing"; })
    .reduce(function (s, c) { return s + Number(c.amount || 0); }, 0);
  var outgoingOpen = openCheques.filter(function (c) { return c.direction === "outgoing"; })
    .reduce(function (s, c) { return s + Number(c.amount || 0); }, 0);

  /* per-Persian-month report, last 6 months that have data */
  var byMonth = {};
  db.entries.forEach(function (e) {
    var k = faMonthKey(e.date);
    if (!byMonth[k]) byMonth[k] = { income: 0, expense: 0 };
    byMonth[k][e.type === "income" ? "income" : "expense"] += Number(e.amount || 0);
  });
  var months = Object.keys(byMonth).sort().reverse().slice(0, 6);

  $("#view").innerHTML =
    '<div class="grid3">' +
      '<div class="stat income"><div class="t">جمع دریافتی</div><div class="v">' + money(t.income) + ' <span style="font-size:12px">ریال</span></div></div>' +

      '<div class="stat balance"><div class="t">مانده حساب</div><div class="v">' + money(t.balance) + ' <span style="font-size:12px">ریال</span></div></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px"><h2>گزارش این ماه (' + esc(faMonthKey(today())) + ')</h2>' +
      '<div class="row" style="align-items:center">' +
        '<div><span class="badge b-green">دریافتی ماه</span> <b class="num">' + money(month.income) + '</b></div>' +
        '<div><span class="badge b-red">هزینه ماه</span> <b class="num">' + money(month.expense) + '</b></div>' +
        '<div><span class="badge b-blue">مانده ماه</span> <b class="num">' + money(month.income - month.expense) + '</b></div>' +
      "</div>" +
    "</div>" +
    '<div class="grid2" style="align-items:start">' +
      '<div class="card"><h2>آخرین آیتم‌ها</h2>' +
        (recent.length ? '<div class="tblwrap"><table><tbody>' + recent.map(function (e) {
          return "<tr><td>" + typeBadge(e.type) + "</td><td>" + esc(e.title) +
            "</td><td class='num'>" + money(e.amount) + "</td><td class='hint'>" + faDate(e.date) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
        : '<div class="empty">هنوز آیتمی ثبت نشده است. از تب «آیتم‌ها» شروع کنید.</div>') +
      "</div>" +
      '<div class="card"><h2>چک‌های در جریان</h2>' +
        '<div class="hint" style="margin-bottom:10px">دریافتی: <b style="color:var(--green)">' + money(incomingOpen) + '</b> ریال — پرداختی: <b style="color:var(--red)">' + money(outgoingOpen) + '</b> ریال</div>' +
        (soonCheques.length ? '<div class="tblwrap"><table><tbody>' + soonCheques.map(function (c) {
          var d = daysTo(c.dueDate);
          var badge = d < 0 ? '<span class="badge b-red">' + money(-d) + ' روز گذشته</span>'
            : d === 0 ? '<span class="badge b-amber">امروز</span>'

    "</div>" +
    (months.length ? '<div class="card"><h2>گزارش ماهانه</h2><div class="tblwrap"><table class="month-tbl"><thead><tr>' +

function exportCsv(rows, suffix) {
  var rows2 = [["نوع", "نام آیتم", "مبلغ (ریال)", "تاریخ", "شخص", "کد پیگیری"]];
  rows.forEach(function (e) {
    rows2.push([e.type === "income" ? "دریافتی" : "هزینه", e.title, e.amount, e.date, personName(e.personId), e.tracking]);
  });
  var csv = "\uFEFF" + rows2.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "items" + (suffix ? "-" + suffix : "") + ".csv";
  a.click();
  toast("فایل CSV دانلود شد.");
}

function statusBadge(c) {
  if (c.status === "cashed") return '<span class="badge b-green">واصل</span>';
  if (c.status === "bounced") return '<span class="badge b-red">برگشتی</span>';
  var d = daysTo(c.dueDate);
  if (d === null) return '<span class="badge b-gray">در جریان</span>';
  if (d < 0) return '<span class="badge b-red">' + money(-d) + ' روز گذشته</span>';
  if (d === 0) return '<span class="badge b-amber">امروز</span>';
  return '<span class="badge b-blue">' + money(d) + ' روز مانده</span>';
}
function dirBadge(c) {
  return c.direction === "outgoing"
    ? '<span class="badge b-red">پرداختی</span>'
    : '<span class="badge b-green">دریافتی</span>';
}

function encodeInvoice(v) {
  var payload = {
    t: v.tracking, n: v.number || null, d: v.date, p: personName(v.personId), items: v.items
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function shareUrl(v) {
  return location.origin + location.pathname + "#/share/" + encodeURIComponent(encodeInvoice(v));
}
function decodeInvoice(code) {
  try { return JSON.parse(decodeURIComponent(escape(atob(code)))); }
  catch (e) { return null; }
}

  $("#view").innerHTML =
    '<div class="card"><h2>مدیریت پروفایل</h2>' +
      '<p class="hint">این اطلاعات در صفحه پرداخت فاکتور (لینک اشتراک‌گذاری‌شده) نمایش داده می‌شود.</p>' +
      '<div class="grid2">' +
        '<div><label>نام صاحب حساب</label><input id="s-name" value="' + esc(p.name) + '"></div>' +
        '<div><label>شماره تماس</label><input id="s-phone" inputmode="tel" value="' + esc(p.phone) + '"></div>' +
        '<div><label>شماره شبا (بدون IR)</label><input id="s-sheba" inputmode="numeric" value="' + esc(p.sheba) + '" placeholder="019000000000000000000001"></div>' +
        '<div><label>شماره کارت</label><input id="s-card" inputmode="numeric" value="' + esc(p.card) + '" placeholder="6037…"></div>' +
      "</div>" +
      '<div style="margin-top:12px"><label>پیام راهنمای پرداخت (از {phone} برای شماره تماس استفاده کنید)</label>' +
        '<textarea id="s-note" rows="2">' + esc(p.payNote) + "</textarea></div>" +
      '<div class="actions"><button class="btn" id="s-save">ذخیره</button></div>' +
    "</div>" +
    '<div class="card"><h2>پشتیبان‌گیری از داده‌ها</h2>' +
      '<p class="hint">تمام داده‌ها فقط داخل همین مرورگر ذخیره می‌شوند. برای انتقال به دستگاه دیگر از خروجی/ورودی JSON استفاده کنید.</p>' +
      '<div class="actions">' +
        '<button class="btn ghost" id="s-export">دانلود خروجی (JSON)</button>' +
        '<button class="btn ghost" id="s-import">بازیابی از فایل</button>' +
        '<input type="file" id="s-file" accept=".json" style="display:none">' +
      "</div>" +
    "</div>" +
    '<div class="card"><h2 style="color:var(--red)">پاک کردن همه داده‌ها</h2>' +
      '<div class="actions"><button class="btn red" id="s-reset">پاک کردن کامل</button></div>' +
    "</div>";

  $("#s-save").onclick = function () {
    db.profile = {
      name: $("#s-name").value.trim(), phone: $("#s-phone").value.trim(),
      sheba: $("#s-sheba").value.trim(), card: $("#s-card").value.trim(),
      payNote: $("#s-note").value.trim()
    };
    save(); toast("ذخیره شد.");
  };
  $("#s-export").onclick = function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }));
    a.download = "invoice-manager-backup.json";
    a.click();
  };
  $("#s-import").onclick = function () { $("#s-file").click(); };
  $("#s-file").onchange = function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (typeof d !== "object" || d === null) throw 0;
        var base = defaultData();
        for (var k in base) if (d[k] === undefined) d[k] = base[k];
        db = d; save(); toast("بازیابی انجام شد."); viewSettings();
      } catch (e) { toast("فایل معتبر نیست."); }
    };
    r.readAsText(f);
  };
  $("#s-reset").onclick = function () {
    if (!confirm("آیا از پاک کردن تمام داده‌ها (آیتم‌ها، چک‌ها، فاکتورها و اشخاص) مطمئن هستید؟ این کار قابل بازگشت نیست.")) return;
    if (!confirm("مطمئن هستید؟")) return;
    db = defaultData(); save(); toast("تمام داده‌ها پاک شد."); go("dashboard");
  };
}

/* ---------- boot ---------- */
$("#theme-btn").onclick = function () {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("invoice_theme", next); } catch (e) {}
};
if (!location.hash) location.hash = "#/dashboard";
render();
</script>
</body>
</html>
